name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # ================= BACKEND =================

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Prisma Generate
        run: |
          cd backend
          npx prisma generate

      - name: Backend Lint
        run: |
          cd backend
          npm run lint

      # ================= FRONTEND =================

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Frontend Build
        run: |
          cd frontend
          npm run build